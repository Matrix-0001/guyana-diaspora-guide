name: Daily rebuild (fresh currency rates)

on:
  schedule:
    # 10:00 UTC daily — early morning in NY/Toronto, mid-morning in London
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  trigger-netlify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        env:
          BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$BUILD_HOOK" ]; then
            echo "NETLIFY_BUILD_HOOK secret not set yet - skipping."
            exit 0
          fi
          curl -s -X POST -d '{}' "$BUILD_HOOK"
          echo "Netlify rebuild triggered."
